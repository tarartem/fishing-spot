name: Production Release & Deploy Verification

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm run test

      - name: Run DB Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run db:migrate

      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment via deploy hook..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy hook triggered successfully."
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Triggering Render deployment via Render REST API..."
            curl -s -f -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "do_not_clear"}' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
            echo "Render API deployment initiated successfully."
          else
            echo "Relying on Render's native GitHub commit auto-deploy on branch production."
          fi

      - name: Verify Health Endpoint
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || 'https://fishing-spot-letv.onrender.com' }}
        run: |
          echo "Checking health endpoint at $PRODUCTION_URL/api/health..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Production service is healthy (HTTP 200)!"
              exit 0
            fi
            echo "Waiting for service to be healthy... (attempt $i/30, got HTTP $STATUS)"
            sleep 10
          done
          echo "Warning: Health endpoint did not return 200 within timeout."
